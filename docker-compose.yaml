services:
  # POSTGRESQL
  fiber-postgres:
    image: postgres:18
    container_name: fiber-postgres

    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    restart: always

  # REDIS
  fiber-redis:
    image: redis:8
    container_name: fiber-redis

    ports:
      - 6380:6379

    volumes:
      - redis_data:/data

    restart: always

volumes:
  postgres_data:
  redis_data:
